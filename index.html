<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yomi 読み · 日文原著假名标注阅读器</title>
<meta name="description" content="Yomi：面向日文原著读者的假名标注阅读器。粘贴或上传日文文本，自动标注汉字假名、统计生词密度、收集生词。全部在浏览器本地完成。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23FBF8EC'/%3E%3Crect x='7' y='2' width='2' height='3' fill='%237A4A21'/%3E%3Crect x='9' y='2' width='2' height='1' fill='%233F8F2C'/%3E%3Crect x='4' y='5' width='8' height='8' fill='%238CC63F'/%3E%3Crect x='3' y='7' width='10' height='5' fill='%238CC63F'/%3E%3Crect x='5' y='6' width='2' height='2' fill='%23F2FADC'/%3E%3C/svg%3E">
<link rel="stylesheet" href="press-start-2p.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="brand">
    <span class="brand-apple" data-apple aria-hidden="true"></span>
    <span class="brand-name">Yomi</span>
  </div>
</header>

<main>
  <section class="hero">
    <span class="hero-apple" data-apple aria-hidden="true"></span>
    <h1>读日文原著，不再被生词绊住</h1>
  </section>

  <section class="workbench">
    <div class="col-main">

      <div class="card input-card" id="input-card">
        <div class="card-head">
          <h2>① 放入你的日文</h2>
          <span class="hint">粘贴 / TXT / PDF · 可拖文件进来 · 整本 PDF（含竖排）自动转横排+注音，生成双语 HTML 下载</span>
        </div>
        <textarea id="input-text" spellcheck="false"
          placeholder="ここに日本語の文章を貼り付けてください…&#10;（例：山のふもとの小さな町に、名もなき時計店があった。）"></textarea>
        <div class="input-actions">
          <button class="btn btn-primary" id="btn-annotate" type="button">标注假名 ▶</button>
          <button class="btn" id="btn-file" type="button">上传 TXT / PDF</button>
          <button class="btn" id="btn-sample" type="button">试试示例文本</button>
          <button class="btn" id="btn-clear" type="button">清空</button>
          <span class="char-count" id="char-count">0 字</span>
          <input type="file" id="file-input" accept=".txt,.pdf" hidden>
        </div>
        <div class="loading" id="loading" hidden>
          <div class="loading-box">
            <div class="pixel-spinner" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
            <p id="loading-msg">Yomi v2.1 · 正在加载日语词典…</p>
            <div class="progress" id="progress-wrap" hidden>
              <div class="progress-fill" id="progress-fill"></div>
            </div>
            <p class="progress-pct" id="progress-pct" hidden>0%</p>
            <button class="btn btn-small" id="btn-retry" type="button" hidden>重试</button>
          </div>
        </div>
      </div>

      <div class="card reader-card" id="reader-card">
        <div class="card-head">
          <h2>② 阅读 & 校对</h2>
          <div class="reader-tools">
            <div class="seg" id="mode-seg" role="group" aria-label="假名显示模式">
              <button class="seg-btn active" data-mode="always" type="button">假名常显</button>
              <button class="seg-btn" data-mode="hover" type="button">悬停显示</button>
              <button class="seg-btn" data-mode="off" type="button">隐藏假名</button>
            </div>
            <div class="font-ctrl">
              <button class="btn btn-small" id="font-down" type="button" aria-label="缩小字号">A-</button>
              <button class="btn btn-small" id="font-up" type="button" aria-label="放大字号">A+</button>
            </div>
            <button class="btn btn-small" id="btn-copy" type="button">复制带读音文本</button>
            <button class="btn btn-small" id="btn-export" type="button">导出 HTML</button>
          </div>
        </div>
        <div class="reader mode-always" id="reader"></div>
        <div class="pager" id="pager" hidden>
          <button class="btn btn-small" id="pg-prev" type="button">◀ 上一页</button>
          <span class="pg-info" id="pg-info">第 1 / 1 页</span>
          <button class="btn btn-small" id="pg-next" type="button">下一页 ▶</button>
        </div>
      </div>

    </div>
  </section>
</main>

<div class="toast" id="toast" hidden></div>

<script src="pdf.min.js"></script>
<script src="book-template.js"></script>
<script src="kuromoji.js"></script>
<script src="app.js?v=3.0"></script>
</body>
</html>
